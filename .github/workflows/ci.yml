# =============================================================================
# CI for ML code (M6 / CS11: CI-CD principles for ML pipelines).
#
# Two things worth noting about testing an ML system in CI:
#
# 1. CI has no Kaggle credentials and no GPU, so the pipeline job runs against
#    the **synthetic** generator. That is exactly why the generator was kept
#    after the real dataset arrived -- it makes the whole DAG exercisable on a
#    clean runner in about a minute.
# 2. The pipeline job asserts the *contract* between stages (a manifest is
#    produced, it is leakage-free, a bundle loads and serves), not model
#    accuracy. Accuracy on 200 synthetic images at 2 epochs is noise; asserting
#    on it would produce a flaky suite that people learn to ignore.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      # `ruff check` is the gate: it enforces the rules that catch real defects
      # (unused names, shadowed loop variables in closures, unsorted imports,
      # needless complexity) as configured in pyproject.toml.
      #
      # `ruff format --check` is deliberately NOT run. The codebase uses a
      # consistent hanging-indent style; the formatter's only disagreement is
      # that it wraps `list.append(Ctor(...))` in an extra indentation level,
      # which reads worse here. Enforcing it would churn every file to satisfy
      # a preference, not to fix anything.
      - name: Lint
        run: ruff check src tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.2" "torchvision>=0.17"
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Run the test suite
        run: pytest -v --cov=defectvision --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  pipeline:
    name: End-to-end pipeline (synthetic)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.2" "torchvision>=0.17"
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: M2 - data pipeline
        run: |
          python -m defectvision.cli data \
            --source synthetic \
            -s data.synthetic.n_images=240 \
            -s data.image_size=64 \
            -s preprocess.resize=64 \
            -s validation.min_images_per_class=40

      - name: M3 - train (2 epochs, no pretrained weights)
        run: |
          python -m defectvision.cli train --model baseline_cnn --no-compare \
            -s train.models.baseline_cnn.epochs=2 \
            -s train.models.baseline_cnn.channels='[8,16]' \
            -s preprocess.resize=64 \
            -s evaluate.bootstrap_samples=20

      - name: M4 - package and smoke-test the API
        run: |
          python -m defectvision.cli package --model baseline_cnn
          python -m defectvision.cli serve --port 8000 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/readyz && break || sleep 2
          done
          curl -fsS http://127.0.0.1:8000/readyz
          curl -fsS http://127.0.0.1:8000/model
          IMG=$(find data/raw -name '*.png' | head -1)
          curl -fsS -F "file=@${IMG}" http://127.0.0.1:8000/predict | tee /tmp/prediction.json
          python -c "
import json, sys
body = json.load(open('/tmp/prediction.json'))
assert body['predicted_class'] in ('ok', 'defect'), body
assert 0.0 <= body['probability_defect'] <= 1.0, body
assert body['decision'] in ('auto_accept', 'auto_reject', 'human_review'), body
print('API contract OK:', body['predicted_class'], round(body['probability_defect'], 4))
"

      - name: M4 - malformed input must be a 4xx, never a 5xx
        run: |
          echo "definitely not an image" > /tmp/bad.png
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -F "file=@/tmp/bad.png" http://127.0.0.1:8000/predict)
          echo "corrupt upload -> HTTP $CODE"
          test "$CODE" -ge 400 && test "$CODE" -lt 500

      - name: M5 - reference, drift simulation, monitoring, trigger
        run: |
          python -m defectvision.cli reference-stats
          python -m defectvision.cli simulate-drift \
            -s monitoring.min_samples_for_drift=20
          python -m defectvision.cli monitor --window 50 \
            -s monitoring.min_samples_for_drift=20
          python -m defectvision.cli check-retrain || true

      - name: Assert the drift detector actually fires
        run: |
          python -c "
import json
report = json.load(open('reports/monitoring_report.json'))
summary = report['summary']
baseline = summary.get('baseline', {}).get('psi_max', 0.0)
shifted = {k: v['psi_max'] for k, v in summary.items() if k != 'baseline'}
assert shifted, 'no drift scenarios were evaluated'
worst = max(shifted, key=shifted.get)
print(f'baseline PSI={baseline:.4f}  worst={worst} PSI={shifted[worst]:.4f}')
assert shifted[worst] > baseline, 'drift scenarios did not register above the noise floor'
print('drift detection OK')
"

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: |
            reports/
            data/processed/dataset_card.json
          retention-days: 14

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: defectvision:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts and reports not-ready without a model
        run: |
          # No bundle is mounted, so /readyz must return 503 -- proving the
          # liveness/readiness split works rather than the process just dying.
          docker run -d --name dv -p 8000:8000 defectvision:ci
          sleep 15
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/readyz || echo 000)
          echo "/readyz without a model -> HTTP $CODE"
          test "$CODE" = "503"
          curl -fsS http://127.0.0.1:8000/healthz
          docker logs dv
          docker rm -f dv
